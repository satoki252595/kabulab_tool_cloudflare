# push / PR ごとに typecheck + lint + test を回す。
#
# これまで CI が存在せず（既存 3 workflow はすべて schedule/dispatch のデータ取込）、
# main に 2 件 red のテストが残ったままだった。壊れたことに気づく層が無かった。
#
# 必要な Secret は無い。DB を持たない環境でも通るテストだけを回す。
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # version は指定しない。package.json の packageManager (pnpm@9.15.9) が
      # 唯一の source of truth で、両方書くと action が二重指定で落ちる。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: test
        run: pnpm test
      # スキーマ宣言と drizzle スナップショットの乖離を落とす。
      #
      # 実際に起きた形: 本番 core_stocks は 21 列・索引 3 本なのに
      # src/shared/db/core-schema.ts は 9 列・索引宣言 0 本、snapshot は 9 列・
      # 索引 1 本。誰も突き合わせていなかったため 3 者が別々の形を主張していた。
      #
      # `drizzle-kit export` の golden diff 方式は採らない。export は
      # **スキーマファイルから DDL を吐くだけで snapshot を見ない**ので、
      # 捕まえたい「宣言 ⇄ snapshot の乖離」をそもそも観測しない
      # (`drizzle-kit check` も journal/snapshot 同士の衝突しか見ない)。
      # Secret 無しで再生成漏れを強制できるのは generate + git status だけ。
      #
      # 注意: これは「宣言 ⇄ snapshot」の一致しか保証しない。本番 D1 との一致は
      # 手 ALTER をやめることでしか守れない (drizzle/d1/README.md)。
      - name: drizzle スナップショットの再生成漏れを検出
        run: |
          pnpm db:generate:d1
          if [ -n "$(git status --porcelain drizzle/d1)" ]; then
            echo "::error::スキーマ宣言と drizzle/d1 のスナップショットが乖離しています。"
            echo "pnpm db:generate:d1 を実行して生成物をコミットしてください。"
            echo "生成された SQL は適用前に必ず読むこと (drizzle/d1/README.md)。"
            git status --porcelain drizzle/d1
            git --no-pager diff -- drizzle/d1
            exit 1
          fi
          echo "drizzle/d1 に差分はありません"
      # skip されたテストを可視化する。フィクスチャ未取得や条件付き skip は
      # 「緑」に見えてしまい、実際に JPX パーサーの破損を 1 ヶ月見逃した。
      - name: skip されたテストを報告
        if: always()
        run: |
          pnpm exec vitest run --reporter=json --outputFile=/tmp/vitest.json > /dev/null 2>&1 || true
          if [ -f /tmp/vitest.json ]; then
            node -e '
              const r = require("/tmp/vitest.json");
              const skipped = (r.testResults ?? []).flatMap(f =>
                (f.assertionResults ?? []).filter(a => a.status === "pending" || a.status === "skipped")
                  .map(a => `${f.name.replace(process.cwd()+"/","")} > ${a.fullName}`));
              if (skipped.length === 0) { console.log("skip されたテストはありません"); process.exit(0); }
              console.log(`::warning::skip されたテストが ${skipped.length} 件あります`);
              for (const s of skipped) console.log("  " + s);
            '
          fi

  # 銘柄コード契約の共有テストベクタが 2 リポジトリで一致しているかを見る。
  #
  # ## なぜ相手リポを checkout するのか
  # 「自リポの JSON を自リポにハードコードしたハッシュと比べる」方式では、
  # 検出できるのは自リポ内の改竄だけで、本来防ぎたい 2 リポ間の乖離は素通りする
  # (どちらのリポも自分の中では整合したまま別の値へ動ける)。両リポジトリとも
  # public なので、secret 無しで相手を checkout して実ファイルを diff できる。
  #
  # ## このジョブが保証すること / しないこと
  #  - する: 両リポの stock-code-vectors.json がバイト単位で同一であること。
  #    各リポの単体テストが「自リポの実装 == 自リポのベクタ」を保証しているので、
  #    両者を合わせると**ベクタに列挙した入力について**実装の一致が言える。
  #  - しない: ベクタに無い入力での一致。実装の等価性そのものではない。
  #  - しない: 相手リポに変更を強制すること。片側でベクタを変えるともう片側の
  #    CI が赤くなる (意図した結合) が、赤いまま main にマージする権限は残る。
  #  - する: 相手リポからベクタが消えたら落ちること。相手ファイル不在で緑に
  #    なるのは**自 main にもまだベクタが無い移行期だけ**に限っている
  #    (無条件に通すと、相手がファイルを消した瞬間に突合が緑のまま無効化される)。
  cross-repo-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: stockStock (Python 側) を取得
        uses: actions/checkout@v4
        with:
          repository: satoki252595/stockStock
          path: .peer-stockstock
          persist-credentials: false
      # 対象ファイルを増やすので、1 ファイル分の手順を関数にして呼ぶ形にした
      # （複製すると片方だけ直される。移行期の猶予判定はコピーしてはいけない
      # 種類のロジックである）。判定とメッセージは従来と 1:1 で同じ。
      - name: 共有契約ファイルを突合
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          # 共有契約ファイルの突合。「自 main にあるのに相手に無い = 共有の破棄」
          # で落とす。pending-peer 猶予は L-36 で畳んだ（両リポ導入済みのため撤去）。
          compare_contract() {
            REL="$1"
            LABEL="$2"
            MINE="$REL"
            PEER=".peer-stockstock/$REL"
            test -f "$MINE" || { echo "::error::$MINE が無い"; return 1; }
            if [ ! -f "$PEER" ]; then
              # 移行期の例外はここだけ。**自リポの main にまだファイルが無い間**に
              # 限って通す。両リポへ入り終わった後 (= 自 main にファイルがある) の
              # 相手側の欠落は「導入途中」ではなく「共有の破棄」なので必ず落とす。
              # 無条件に exit 0 にすると、相手がファイルを移動・改名した瞬間に
              # この突合が「緑のまま無効化」され、乖離検出を謳ったジョブが
              # 何も見ていない状態になる。
              if ! git fetch --depth=1 origin "$DEFAULT_BRANCH" >/dev/null 2>&1; then
                echo "::error::自リポ $DEFAULT_BRANCH を取得できず、移行期か共有破棄かを判別できない。"
                return 1
              fi
              if git cat-file -e "FETCH_HEAD:$MINE" 2>/dev/null; then
                echo "::error::自リポ $DEFAULT_BRANCH には $MINE があるのに相手リポに無い。"
                echo "::error::${LABEL}の片側削除・移動を疑うこと（移行期の猶予は既に終了している）。"
                return 1
              fi
              echo "::warning::相手リポに $PEER が無い（両リポへの導入が完了していない）。突合をスキップ。"
              return 0
            fi
            if ! diff -u "$PEER" "$MINE"; then
              echo "::error::${LABEL}が 2 リポジトリ間で乖離している。"
              echo "::error::どちらが正かを決めて両リポジトリを同時に直すこと。"
              return 1
            fi
            echo "${LABEL}は両リポジトリで一致している。"
          }
          compare_contract tests/fixtures/contracts/stock-code-vectors.json "銘柄コード共有テストベクタ"
          compare_contract tests/fixtures/contracts/d1-license-map.json "D1 列単位ライセンス地図の契約"
