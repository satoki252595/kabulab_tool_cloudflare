# push / PR ごとに typecheck + lint + test を回す。
#
# これまで CI が存在せず（既存 3 workflow はすべて schedule/dispatch のデータ取込）、
# main に 2 件 red のテストが残ったままだった。壊れたことに気づく層が無かった。
#
# 必要な Secret は無い。DB を持たない環境でも通るテストだけを回す。
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # version は指定しない。package.json の packageManager (pnpm@9.15.9) が
      # 唯一の source of truth で、両方書くと action が二重指定で落ちる。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: test
        run: pnpm test
      # スキーマ宣言と drizzle スナップショットの乖離を落とす。
      #
      # 実際に起きた形: 本番 core_stocks は 21 列・索引 3 本なのに
      # src/shared/db/core-schema.ts は 9 列・索引宣言 0 本、snapshot は 9 列・
      # 索引 1 本。誰も突き合わせていなかったため 3 者が別々の形を主張していた。
      #
      # `drizzle-kit export` の golden diff 方式は採らない。export は
      # **スキーマファイルから DDL を吐くだけで snapshot を見ない**ので、
      # 捕まえたい「宣言 ⇄ snapshot の乖離」をそもそも観測しない
      # (`drizzle-kit check` も journal/snapshot 同士の衝突しか見ない)。
      # Secret 無しで再生成漏れを強制できるのは generate + git status だけ。
      #
      # 注意: これは「宣言 ⇄ snapshot」の一致しか保証しない。本番 D1 との一致は
      # 手 ALTER をやめることでしか守れない (drizzle/d1/README.md)。
      - name: drizzle スナップショットの再生成漏れを検出
        run: |
          pnpm db:generate:d1
          if [ -n "$(git status --porcelain drizzle/d1)" ]; then
            echo "::error::スキーマ宣言と drizzle/d1 のスナップショットが乖離しています。"
            echo "pnpm db:generate:d1 を実行して生成物をコミットしてください。"
            echo "生成された SQL は適用前に必ず読むこと (drizzle/d1/README.md)。"
            git status --porcelain drizzle/d1
            git --no-pager diff -- drizzle/d1
            exit 1
          fi
          echo "drizzle/d1 に差分はありません"
      # skip されたテストを可視化する。フィクスチャ未取得や条件付き skip は
      # 「緑」に見えてしまい、実際に JPX パーサーの破損を 1 ヶ月見逃した。
      - name: skip されたテストを報告
        if: always()
        run: |
          pnpm exec vitest run --reporter=json --outputFile=/tmp/vitest.json > /dev/null 2>&1 || true
          if [ -f /tmp/vitest.json ]; then
            node -e '
              const r = require("/tmp/vitest.json");
              const skipped = (r.testResults ?? []).flatMap(f =>
                (f.assertionResults ?? []).filter(a => a.status === "pending" || a.status === "skipped")
                  .map(a => `${f.name.replace(process.cwd()+"/","")} > ${a.fullName}`));
              if (skipped.length === 0) { console.log("skip されたテストはありません"); process.exit(0); }
              console.log(`::warning::skip されたテストが ${skipped.length} 件あります`);
              for (const s of skipped) console.log("  " + s);
            '
          fi

  # 収集パイプライン (pipeline/) と配信 Worker (services/jss-api/) の検査。
  # stockStock の ci から移設。一本化で契約ファイルは単一配置になったため、
  # cross-repo-contract ジョブと peer checkout は撤去した（stockStock 側は
  # Wave 5 のカットオーバーで消す）。
  python-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write  # 失敗通知 (notify-failure) のため
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Sync dependencies
        run: nix develop -c bash -c 'cd pipeline && uv sync --frozen'
      - name: Lint (ruff)
        run: nix develop -c bash -c 'cd pipeline && uv run ruff check src tests scripts'
      - name: Test
        run: nix develop -c bash -c 'cd pipeline && uv run pytest'
      # 配信 Worker (services/jss-api/) は TypeScript。Python と同じ nix devShell
      # の node/pnpm を使う（グローバルへは入れない）。
      - name: Install jss-api deps
        run: nix develop -c bash -c 'cd services/jss-api && pnpm install --frozen-lockfile'
      - name: Typecheck jss-api
        run: nix develop -c bash -c 'cd services/jss-api && pnpm typecheck'
      - name: Test jss-api
        run: nix develop -c bash -c 'cd services/jss-api && pnpm test'
      - name: 失敗したら Issue を立てる
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: "[ジョブ失敗] ci (python-pipeline)"
          summary: "ci の python-pipeline ジョブが失敗しました。"
