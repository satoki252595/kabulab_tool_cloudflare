name: roa_saved_raw_publish

on:
  workflow_dispatch:
    inputs:
      manifest_sha:
        description: "Reviewed SHA256 of the fixed three saved type1 metadata manifest"
        required: true
      accepted_main_sha:
        description: "CI-accepted main commit SHA; must equal this run's GITHUB_SHA"
        required: true

concurrency:
  group: roa-type1-saved-20261014
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false
      - name: Sync the existing locked Python environment
        run: nix develop -c uv sync --project pipeline --frozen
      - name: Publish only the fixed already archived type1 originals
        env:
          APPROVED_MANIFEST_SHA: ${{ inputs.manifest_sha }}
          ACCEPTED_MAIN_SHA: ${{ inputs.accepted_main_sha }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_RAW_FILES: ${{ secrets.NOTION_DB_RAW_FILES }}
          NOTION_ARCHIVE_PAGE_ID: ${{ secrets.NOTION_ARCHIVE_PAGE_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_RAW: ${{ secrets.R2_BUCKET_RAW }}
          R2_BUCKET_TIMESERIES: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          nix develop -c uv run --project pipeline --frozen --offline python \
            pipeline/scripts/publish_saved_roa_raw.py \
            --manifest pipeline/scripts/manifests/roa-type1-saved-20261014.json \
            --approved-manifest-sha "$APPROVED_MANIFEST_SHA" \
            --accepted-main-sha "$ACCEPTED_MAIN_SHA" --apply
      # Raw bodies, signed URLs and private receipts are never printed or uploaded as artifacts.
      # Durable attempt/STOP/complete receipts remain in the existing R2 ops prefix.
