# 007 VWAP 取込を GitHub Actions で定期実行 → R2。
#
# Yahoo取得は共有clientのYAHOO_PROXY_BASE経路。proxy/upstreamの429・ABORTは失敗として扱う。
# 取得済本文は私有ローカル全parts保存・Notion物理照合後にだけR2へ保存する。
# 日足+5分足の月水金17時はCF one-shot dispatch。信用残のscheduleはmainから発火する。
# 実行母集団は取得時のuniverseを使用し、CONC=1の取得を最大30銘柄ずつ保管する。
# 原本保管の追加量/時間と料金条件: docs/test-logs/yahoo-raw-custody-20261002.md。
# 本番R2へのPUTは取得時の版/不在に条件付ける。競合・結果不明は停止し、再送しない。
#
# 必要な GitHub Secrets (Settings → Secrets and variables → Actions):
#   YAHOO_PROXY_BASE      … デプロイ済み Worker の URL 例 https://kabulab-cf.<sub>.workers.dev
#   CRON_SECRET           … Worker secret と同値 (プロキシ認証)
#   R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_BUCKET … R2 書込 (S3 互換)
#   NOTION_TOKEN / NOTION_ARCHIVE_PAGE_ID / NOTION_YUHO_TEXT_DB_ID … Yahoo応答本文・信用残PDFの一次データ記録 (ルール6)
name: vwap-ingest

on:
  schedule:
    # 平日 08:00 UTC (17:00 JST): 信用残高(日次。JPX 16:00 JST 公表後)。
    # 公表日の実原文を基準に保存する（祝日カレンダーの推測で成功にしない）。
    - cron: "0 8 * * 1-5" # 信用残高(日次)
  workflow_dispatch:
    inputs:
      target:
        description: "実行対象"
        type: choice
        default: daily-intra
        options:
          - daily-intra
          - scheduled-daily-intra
          - daily
          - intra
          - margin
          - all
      scheduled_date:
        description: "CF定時起動専用の予定日 YYYY-MM-DD。17:00〜17:10 JST受付・23:30終了"
        type: string
        default: ""
      daily_codes:
        description: "target=daily の対象コード（カンマ区切り）。空欄は通常の全母集団"
        type: string
        default: ""
      daily_session_source:
        description: "日足の市場session原本。保存原本は取得前に選択し、失敗後に切替えない"
        type: choice
        default: yahoo-direct
        options:
          - yahoo-direct
          - archived-jp-leg
      daily_session_date:
        description: "archived-jp-leg専用。実runと同じJST日 YYYY-MM-DD（必須）"
        type: string
        default: ""
      intra_range:
        description: "5分足の取得範囲 (target=intra のバックフィル用。例 5d / 60d。Yahoo上限60d)"
        type: string
        default: "60d"
      intra_codes:
        description: "target=intra の対象コード（カンマ区切り）。空欄は通常の全母集団"
        type: string
        default: ""
      intra_from:
        description: "target=intra / 保存422の5銘柄限定。60日内の最初のJP営業日寄付き ISO UTC"
        type: string
        default: ""
      intra_to_exclusive:
        description: "target=intra / 明示期間の終端 ISO UTC（直近JP引けauction timestamp+1秒、exclusive）"
        type: string
        default: ""

concurrency:
  group: vwap-ingest
  cancel-in-progress: false

permissions:
  contents: read
  issues: write  # 失敗時に Issue を立てるため

jobs:
  ingest:
    # producerだけが保持し、stock-syncのreusable moneyflow呼出し前に解放する。
    concurrency:
      group: yahoo-source
      cancel-in-progress: false
      queue: max # pending同士の後着cancelを防ぐ。Yahoo取得は引き続き1 jobずつ。
    runs-on: ubuntu-latest
    timeout-minutes: 300 # 原本保管追加後の全量時間は初回正常runで計測する。
    env:
      # Yahoo取得は直列。初回429/503・custody失敗は後続取得/PUTを停止する。
      CONC: "1"
      DELAY_MS: "300"
      # 取込 knob の通常値 (必須宣言。コード側に黙示既定なし)。
      MAX_RATE_LIMIT: "1"
      KEEP_DAYS: "365"
      INTRA_RANGE: "5d"
      YAHOO_PROXY_BASE: ${{ secrets.YAHOO_PROXY_BASE }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      # 取込母集団の D1 正規 active-equity 集合 (stock-sync と同じ既存 secret 名)
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      # 信用残 PDF の Notion 一次データ記録 (ルール6) 用
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_ARCHIVE_PAGE_ID: ${{ secrets.NOTION_ARCHIVE_PAGE_ID }}
      NOTION_YUHO_TEXT_DB_ID: ${{ secrets.NOTION_YUHO_TEXT_DB_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # packageManager (pnpm@9.15.9) を読む

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 明示5分足期間の対象を検査
        if: github.event_name == 'workflow_dispatch' && (inputs.intra_from != '' || inputs.intra_to_exclusive != '')
        env:
          TARGET: ${{ inputs.target }}
          INTRA_FROM: ${{ inputs.intra_from }}
          INTRA_TO_EXCLUSIVE: ${{ inputs.intra_to_exclusive }}
        run: |
          if [ "$TARGET" != "intra" ] || [ -z "$INTRA_FROM" ] || [ -z "$INTRA_TO_EXCLUSIVE" ]; then
            echo "explicit_intra_window=invalid reason=target-or-incomplete-boundary"
            exit 2
          fi

      - name: 明示日足session原本の入力を検査
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET: ${{ inputs.target }}
          DAILY_SESSION_SOURCE: ${{ inputs.daily_session_source }}
          DAILY_SESSION_DATE: ${{ inputs.daily_session_date }}
          SCHEDULED_DATE: ${{ inputs.scheduled_date }}
        run: |
          if [ "$TARGET" = "scheduled-daily-intra" ]; then
            if [ -z "$SCHEDULED_DATE" ] || [ "$DAILY_SESSION_SOURCE" != "yahoo-direct" ] || [ -n "$DAILY_SESSION_DATE" ]; then exit 2; fi
          elif [ -n "$SCHEDULED_DATE" ]; then
            exit 2
          fi
          if [ "$DAILY_SESSION_SOURCE" = "archived-jp-leg" ]; then
            if [ "$TARGET" != "daily" ] && [ "$TARGET" != "daily-intra" ] && [ "$TARGET" != "all" ]; then exit 2; fi
            if [ -z "$DAILY_SESSION_DATE" ]; then exit 2; fi
          elif [ -n "$DAILY_SESSION_DATE" ]; then
            exit 2
          fi

      # 日足10年 + 5分足 (CF月水金17時または明示dispatch)。dispatch=daily は日足だけ。
      - name: VWAP daily + intra → R2
        if: >-
          (github.event_name == 'workflow_dispatch' &&
            (github.event.inputs.target == 'scheduled-daily-intra' || github.event.inputs.target == 'daily-intra' || github.event.inputs.target == 'daily' || github.event.inputs.target == 'all'))
        env:
          DAILY_ONLY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'daily' }}
          DAILY_CODES: ${{ github.event.inputs.daily_codes }}
          DAILY_SESSION_SOURCE: ${{ inputs.daily_session_source }}
          DAILY_SESSION_DATE: ${{ inputs.daily_session_date }}
          TARGET: ${{ inputs.target }}
          SCHEDULED_DATE: ${{ inputs.scheduled_date }}
        run: |
          # daily の errors/invalid (exit1) で intra を道連れにしない。exit2
          # (連続429/503 ABORT・R2 fatal unknown/rejected/GET fault・バッチ保管
          # 失敗・main 想定外) とその他の未完了/異常出口は intra を走らせず exit2 (「これ以上叩くな」
          # 契約と未保管成功なしを維持)。
          daily_args=()
          intra_args=()
          if [ "$TARGET" = "scheduled-daily-intra" ]; then
            daily_args+=("--scheduled-date=$SCHEDULED_DATE")
            intra_args+=("--scheduled-date=$SCHEDULED_DATE")
          fi
          if [ -n "$DAILY_SESSION_SOURCE" ]; then daily_args+=("--session-source=$DAILY_SESSION_SOURCE"); fi
          if [ -n "$DAILY_SESSION_DATE" ]; then daily_args+=("--session-date=$DAILY_SESSION_DATE"); fi
          daily_rc=0
          if [ "$DAILY_ONLY" = "true" ] && [ -n "$DAILY_CODES" ]; then
            pnpm ingest:vwap-daily "${daily_args[@]}" --codes="$DAILY_CODES" || daily_rc=$?
          else
            pnpm ingest:vwap-daily "${daily_args[@]}" || daily_rc=$?
          fi
          if [ "$daily_rc" -ne 0 ] && [ "$daily_rc" -ne 1 ]; then
            echo "daily_exit=${daily_rc} intra_exit=not-run reason=daily-abort"
            exit 2
          fi
          if [ "$DAILY_ONLY" = "true" ]; then
            echo "daily_exit=${daily_rc} intra_exit=not-run reason=daily-only"
            exit "$daily_rc"
          fi
          intra_rc=0
          pnpm ingest:vwap-intra "${intra_args[@]}" || intra_rc=$?
          echo "daily_exit=${daily_rc} intra_exit=${intra_rc}"
          if [ "$intra_rc" -ne 0 ] && [ "$intra_rc" -ne 1 ]; then exit 2; fi
          if [ "$daily_rc" -ne 0 ] || [ "$intra_rc" -ne 0 ]; then exit 1; fi

      # 5分足のみ (dispatch=intra)。intra_range で 60d バックフィル可能 (Yahoo上限60d)。
      # daily を伴わないので所要時間を抑えられる。以後は平日 cron の 5d 延伸が引き継ぐ。
      - name: VWAP intra backfill → R2
        if: >-
          github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'intra'
        env:
          INTRA_RANGE: ${{ github.event.inputs.intra_range }}
          INTRA_CODES: ${{ github.event.inputs.intra_codes }}
          INTRA_FROM: ${{ github.event.inputs.intra_from }}
          INTRA_TO_EXCLUSIVE: ${{ github.event.inputs.intra_to_exclusive }}
        run: |
          if [ -n "$INTRA_FROM" ] || [ -n "$INTRA_TO_EXCLUSIVE" ]; then
            pnpm ingest:vwap-intra --codes="$INTRA_CODES" --from="$INTRA_FROM" --to-exclusive="$INTRA_TO_EXCLUSIVE"
          elif [ -n "$INTRA_CODES" ]; then
            pnpm ingest:vwap-intra --codes="$INTRA_CODES"
          else
            pnpm ingest:vwap-intra
          fi

      # 信用残高 日次 (平日 cron または dispatch=margin/all)
      - name: VWAP margin (daily) → R2
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '0 8 * * 1-5') ||
          (github.event_name == 'workflow_dispatch' &&
            (github.event.inputs.target == 'margin' || github.event.inputs.target == 'all'))
        run: pnpm ingest:vwap-margin
      # archive 前に producer が cwd/.vwap-summaries/ へ原本 bytes を保持する。
      # 保管失敗 (413 UNKNOWN 等) でも summary が ephemeral runner と共に消えない。
      - name: summary を失敗時 artifact に残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vwap-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: .vwap-summaries/
          # v4 は既定で hidden files を除外する。限定 exact dir のみ対象。
          include-hidden-files: true
          if-no-files-found: warn
      - name: 失敗したら Issue を立てる
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: "[ジョブ失敗] ${{ github.workflow }}"
          summary: "${{ github.workflow }} が失敗しました。"
