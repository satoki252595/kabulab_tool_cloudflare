# 日足・5分足・信用残。原本保管後の条件付きR2保存。運用は docs/production-job-inventory.md。
name: vwap-ingest

on:
  workflow_dispatch:
    inputs:
      target:
        description: "実行対象"
        type: choice
        default: daily-intra
        options:
          - daily-intra
          - scheduled-daily-intra
          - scheduled-margin
          - daily
          - intra
          - margin
          - all
      scheduled_date:
        description: "CF予定日 YYYY-MM-DD。17:00〜17:10受付、価格23:30/信用残17:30新規IO終了"
        type: string
        default: ""
      scheduled_at:
        description: "CF controller.scheduledTime のミリ秒付きUTC。17:00〜17:10の起動受付。価格23:30/信用残17:30は実時計"
        type: string
        default: ""
      daily_codes:
        description: "target=daily の対象コード（カンマ区切り）。空欄は通常の全母集団"
        type: string
        default: ""
      daily_session_source:
        description: "日足の市場session原本。保存原本は取得前に選択し、失敗後に切替えない"
        type: choice
        default: yahoo-direct
        options:
          - yahoo-direct
          - archived-jp-leg
      daily_session_date:
        description: "archived-jp-leg専用。実runと同じJST日 YYYY-MM-DD（必須）"
        type: string
        default: ""
      intra_range:
        description: "5分足の取得範囲 (target=intra のバックフィル用。例 5d / 60d。Yahoo上限60d)"
        type: string
        default: "60d"
      intra_codes:
        description: "target=intra の対象コード（カンマ区切り）。空欄は通常の全母集団"
        type: string
        default: ""
      intra_max_start_seconds:
        description: "target=intra/明示100コード以内専用。新規取得・PUTの開始予算1〜900秒（空欄は既存動作）"
        type: string
        default: ""
      intra_from:
        description: "target=intra / 保存422の5銘柄限定。60日内の最初のJP営業日寄付き ISO UTC"
        type: string
        default: ""
      intra_to_exclusive:
        description: "target=intra / 明示期間の終端 ISO UTC（直近JP引けauction timestamp+1秒、exclusive）"
        type: string
        default: ""

concurrency:
  group: ${{ (inputs.target == 'scheduled-margin' || inputs.target == 'margin') && 'vwap-margin' || 'vwap-ingest' }}
  cancel-in-progress: false
  # 既定 queue:single は pending を1件だけ残し、次の pending が先の pending を cancel する。
  # queue:max は最大100件まで待たせる（cancel-in-progress: true とは併用不可）。
  queue: max

permissions:
  contents: read
  issues: write  # 失敗時に Issue を立てるため

env:
  CONC: "1"
  DELAY_MS: "0"
  MAX_RATE_LIMIT: "1"
  KEEP_DAYS: "365"
  INTRA_RANGE: "5d"
  YAHOO_PROXY_BASE: ${{ secrets.YAHOO_PROXY_BASE }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
  NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
  NOTION_ARCHIVE_PAGE_ID: ${{ secrets.NOTION_ARCHIVE_PAGE_ID }}
  NOTION_YUHO_TEXT_DB_ID: ${{ secrets.NOTION_YUHO_TEXT_DB_ID }}

jobs:
  ingest:
    # producerだけが保持し、stock-syncのreusable moneyflow呼出し前に解放する。
    concurrency:
      group: ${{ (inputs.target == 'scheduled-margin' || inputs.target == 'margin') && 'vwap-margin-source' || 'yahoo-source' }}
      cancel-in-progress: false
      queue: max # pending同士の後着cancelを防ぐ。Yahoo取得は引き続き1 jobずつ。
    runs-on: ubuntu-latest
    timeout-minutes: 300 # 原本保管追加後の全量時間は初回正常runで計測する。
    outputs:
      daily_exit: ${{ steps.prices.outputs.daily_exit }}
      daily_closed: ${{ steps.admission.outcome == 'success' && steps.prices.outputs.daily_closed }}
    env:
      NOTION_MAX_RPS: ${{ (inputs.target == 'scheduled-margin' || inputs.target == 'margin') && '1.0' || '1.6' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # packageManager (pnpm@9.15.9) を読む

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 明示5分足期間の対象を検査
        if: github.event_name == 'workflow_dispatch' && (inputs.intra_from != '' || inputs.intra_to_exclusive != '')
        env:
          TARGET: ${{ inputs.target }}
          INTRA_FROM: ${{ inputs.intra_from }}
          INTRA_TO_EXCLUSIVE: ${{ inputs.intra_to_exclusive }}
        run: |
          if [ "$TARGET" != "intra" ] || [ -z "$INTRA_FROM" ] || [ -z "$INTRA_TO_EXCLUSIVE" ]; then
            echo "explicit_intra_window=invalid reason=target-or-incomplete-boundary"
            exit 2
          fi

      - name: 明示日足session原本の入力を検査
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET: ${{ inputs.target }}
          DAILY_SESSION_SOURCE: ${{ inputs.daily_session_source }}
          DAILY_SESSION_DATE: ${{ inputs.daily_session_date }}
          SCHEDULED_DATE: ${{ inputs.scheduled_date }}
          INTRA_MAX_START_SECONDS: ${{ inputs.intra_max_start_seconds }}
        run: |
          if [ "$TARGET" = "scheduled-daily-intra" ] || [ "$TARGET" = "scheduled-margin" ]; then
            if [ -z "$SCHEDULED_DATE" ] || [ "$DAILY_SESSION_SOURCE" != "yahoo-direct" ] || [ -n "$DAILY_SESSION_DATE" ]; then exit 2; fi
          elif [ -n "$SCHEDULED_DATE" ]; then
            exit 2
          fi
          if [ -n "$INTRA_MAX_START_SECONDS" ] && [ "$TARGET" != "intra" ]; then exit 2; fi
          if [ "$DAILY_SESSION_SOURCE" = "archived-jp-leg" ]; then
            if [ "$TARGET" != "daily" ] && [ "$TARGET" != "daily-intra" ] && [ "$TARGET" != "all" ]; then exit 2; fi
            if [ -z "$DAILY_SESSION_DATE" ]; then exit 2; fi
          elif [ -n "$DAILY_SESSION_DATE" ]; then
            exit 2
          fi

      # 日足10年 + 5分足 (CF月水金17時または明示dispatch)。dispatch=daily は日足だけ。
      - name: VWAP daily + intra → R2
        id: prices
        if: >-
          (github.event_name == 'workflow_dispatch' &&
            (github.event.inputs.target == 'scheduled-daily-intra' || github.event.inputs.target == 'daily-intra' || github.event.inputs.target == 'daily' || github.event.inputs.target == 'all'))
        env:
          DAILY_ONLY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'daily' }}
          DAILY_CODES: ${{ github.event.inputs.daily_codes }}
          DAILY_SESSION_SOURCE: ${{ inputs.daily_session_source }}
          DAILY_SESSION_DATE: ${{ inputs.daily_session_date }}
          TARGET: ${{ inputs.target }}
          SCHEDULED_DATE: ${{ inputs.scheduled_date }}
          SCHEDULED_AT: ${{ inputs.scheduled_at }}
        run: |
          # daily の errors/invalid (exit1) で intra を道連れにしない。exit2
          # (連続429/503 ABORT・R2 fatal unknown/rejected/GET fault・バッチ保管
          # 失敗・main 想定外) とその他の未完了/異常出口は intra を走らせず exit2 (「これ以上叩くな」
          # 契約と未保管成功なしを維持)。
          daily_args=()
          intra_args=()
          if [ "$TARGET" = "scheduled-daily-intra" ]; then
            daily_args+=("--scheduled-date=$SCHEDULED_DATE")
            daily_args+=("--scheduled-at=$SCHEDULED_AT")
            intra_args+=("--scheduled-date=$SCHEDULED_DATE")
          fi
          if [ -n "$DAILY_SESSION_SOURCE" ]; then daily_args+=("--session-source=$DAILY_SESSION_SOURCE"); fi
          if [ -n "$DAILY_SESSION_DATE" ]; then daily_args+=("--session-date=$DAILY_SESSION_DATE"); fi
          daily_rc=0
          if [ "$DAILY_ONLY" = "true" ] && [ -n "$DAILY_CODES" ]; then
            pnpm ingest:vwap-daily "${daily_args[@]}" --codes="$DAILY_CODES" || daily_rc=$?
          else
            pnpm ingest:vwap-daily "${daily_args[@]}" || daily_rc=$?
          fi
          if [ "$daily_rc" -ne 0 ] && [ "$daily_rc" -ne 1 ]; then
            echo "daily_exit=${daily_rc} intra_exit=not-run reason=daily-abort"
            exit 2
          fi
          if [ "$TARGET" = "scheduled-daily-intra" ]; then
            echo "daily_exit=${daily_rc}" >> "$GITHUB_OUTPUT"
            echo "daily_closed=true" >> "$GITHUB_OUTPUT"
            exit "$daily_rc"
          fi
          if [ "$DAILY_ONLY" = "true" ]; then
            echo "daily_exit=${daily_rc} intra_exit=not-run reason=daily-only"
            exit "$daily_rc"
          fi
          intra_rc=0
          pnpm ingest:vwap-intra "${intra_args[@]}" || intra_rc=$?
          echo "daily_exit=${daily_rc} intra_exit=${intra_rc}"
          if [ "$intra_rc" -ne 0 ] && [ "$intra_rc" -ne 1 ]; then exit 2; fi
          if [ "$daily_rc" -ne 0 ] || [ "$intra_rc" -ne 0 ]; then exit 1; fi

      - name: 定時日足の同run受付記録を保存
        id: admission
        if: ${{ !cancelled() && inputs.target == 'scheduled-daily-intra' && steps.prices.outputs.daily_closed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: vwap-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: .vwap-summaries/vwap-scheduled-admission-${{ github.run_id }}.${{ github.run_attempt }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      # 5分足のみ (dispatch=intra)。intra_range で 60d バックフィル可能 (Yahoo上限60d)。
      # daily を伴わないので所要時間を抑えられる。以後は平日 cron の 5d 延伸が引き継ぐ。
      - name: VWAP intra backfill → R2
        if: >-
          github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'intra'
        env:
          INTRA_RANGE: ${{ github.event.inputs.intra_range }}
          INTRA_CODES: ${{ github.event.inputs.intra_codes }}
          INTRA_FROM: ${{ github.event.inputs.intra_from }}
          INTRA_TO_EXCLUSIVE: ${{ github.event.inputs.intra_to_exclusive }}
          INTRA_MAX_START_SECONDS: ${{ inputs.intra_max_start_seconds }}
        run: |
          budget_args=()
          if [ -n "$INTRA_MAX_START_SECONDS" ]; then budget_args+=("--max-start-seconds=$INTRA_MAX_START_SECONDS"); fi
          if [ -n "$INTRA_FROM" ] || [ -n "$INTRA_TO_EXCLUSIVE" ]; then
            pnpm ingest:vwap-intra "${budget_args[@]}" --codes="$INTRA_CODES" --from="$INTRA_FROM" --to-exclusive="$INTRA_TO_EXCLUSIVE"
          elif [ -n "$INTRA_CODES" ]; then
            pnpm ingest:vwap-intra "${budget_args[@]}" --codes="$INTRA_CODES"
          else
            pnpm ingest:vwap-intra "${budget_args[@]}"
          fi

      # 信用残はCF定時または明示手動。基準日/公表日は取得原文のまま。
      - name: VWAP margin (daily) → R2
        if: >-
          (github.event_name == 'workflow_dispatch' &&
            (github.event.inputs.target == 'scheduled-margin' || github.event.inputs.target == 'margin' || github.event.inputs.target == 'all'))
        env:
          TARGET: ${{ inputs.target }}
          SCHEDULED_DATE: ${{ inputs.scheduled_date }}
          SCHEDULED_AT: ${{ inputs.scheduled_at }}
        run: |
          args=()
          if [ "$TARGET" = "scheduled-margin" ]; then args+=("--scheduled-date=$SCHEDULED_DATE" "--scheduled-at=$SCHEDULED_AT"); fi
          pnpm ingest:vwap-margin "${args[@]}"
      # archive 前に producer が cwd/.vwap-summaries/ へ原本 bytes を保持する。
      # 保管失敗 (413 UNKNOWN 等) でも summary が ephemeral runner と共に消えない。
      - name: summary を失敗時 artifact に残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vwap-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: .vwap-summaries/
          # v4 は既定で hidden files を除外する。限定 exact dir のみ対象。
          include-hidden-files: true
          if-no-files-found: warn
      - name: 失敗したら Issue を立てる
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: "[ジョブ失敗] ${{ github.workflow }}"
          summary: "${{ github.workflow }} が失敗しました。"

  ingest-intra:
    needs: ingest
    if: ${{ !cancelled() && inputs.target == 'scheduled-daily-intra' && needs.ingest.outputs.daily_closed == 'true' }}
    concurrency:
      group: yahoo-source
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      intra_exit: ${{ steps.intra.outputs.intra_exit }}
    env:
      NOTION_MAX_RPS: "1.6"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: vwap-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: .vwap-summaries
      - name: VWAP scheduled intra → R2
        id: intra
        env:
          SCHEDULED_DATE: ${{ inputs.scheduled_date }}
        run: |
          rc=0
          pnpm ingest:vwap-intra "--scheduled-date=$SCHEDULED_DATE" || rc=$?
          echo "intra_exit=${rc}" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: summary を失敗時 artifact に残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vwap-summary-${{ github.run_id }}-${{ github.run_attempt }}-intra
          path: .vwap-summaries/
          include-hidden-files: true
          if-no-files-found: warn
      - name: 失敗したら Issue を立てる
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: "[ジョブ失敗] ${{ github.workflow }}"
          summary: "${{ github.workflow }} の定時5分足が失敗しました。"

  scheduled-result:
    needs: [ingest, ingest-intra]
    if: ${{ !cancelled() && inputs.target == 'scheduled-daily-intra' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: VWAP scheduled result
        env:
          DAILY_CLOSED: ${{ needs.ingest.outputs.daily_closed }}
          DAILY_EXIT: ${{ needs.ingest.outputs.daily_exit }}
          INTRA_EXIT: ${{ needs.ingest-intra.outputs.intra_exit }}
        run: |
          if [ "$DAILY_CLOSED" != "true" ]; then exit 2; fi
          case "$DAILY_EXIT:$INTRA_EXIT" in
            0:0) exit 0 ;;
            0:1|1:0|1:1) exit 1 ;;
            *) exit 2 ;;
          esac
