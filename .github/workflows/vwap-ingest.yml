# 007 VWAP 取込を GitHub Actions で定期実行 → R2。
#
# Yahoo は **YAHOO_PROXY_BASE 経由 (Worker エッジの /api/ingest/yahoo)** で
# 叩くため、GitHub ランナー(Azure 共有 IP)が Yahoo に直接弾かれる(429)ことはない。
# Cloudflare エッジ IP 経由になるので runner IP は Yahoo から見えない。
#
# このワークフローは **default ブランチ(main)** から発火する。schedule を効かせるには
# main にマージ済みであること。
#
# ⚠️ 実行時間/コスト: 全 ~4,445 銘柄を回す。**CONC=5 並列**(下の env)で 1パス ~30分、
# daily+intra ~1h(旧 CONC=1 は ~5h で timeout 接近・月数千分だった)。日足+5分足 cron は
# **週3(月/水/金)** なので概算 ~1h × 週3 ≈ 月 ~800 分 + margin。stock-sync/catchup を足しても
# private 無料枠(2,000 min/月)内に収まる想定。Yahoo は YAHOO_PROXY_BASE 経由 + MAX_RL ガードで
# 並列でも 429 は抑制(stock-sync が同 CONC=5 で実証済み)。実測は run の所要時間で監視すること。
#
# ⚠️ 取込は **本番 R2(R2_BUCKET secret)** に直接書く(環境分離なし)。マージ剪定で冪等なので
# 再実行は安全(既書込分は ts キーでマージされる)。
#
# 必要な GitHub Secrets (Settings → Secrets and variables → Actions):
#   YAHOO_PROXY_BASE      … デプロイ済み Worker の URL 例 https://kabulab-cf.<sub>.workers.dev
#   CRON_SECRET           … Worker secret と同値 (プロキシ認証)
#   R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_BUCKET … R2 書込 (S3 互換)
name: vwap-ingest

on:
  schedule:
    # 月/水/金 08:00 UTC (17:00 JST・東証引け後): 日足10年 + 5分足。Actions 分節約のため週5→週3に間引き。
    # 5分足取込は毎回 range=5d で取得しマージするので、最大2営業日のギャップは次回が回収=取りこぼし無し。
    - cron: "0 8 * * 1,3,5"
    - cron: "0 9 * * 6" # 土 09:00 UTC: 信用残高(週次)
  workflow_dispatch:
    inputs:
      target:
        description: "実行対象"
        type: choice
        default: daily-intra
        options:
          - daily-intra
          - intra
          - margin
          - all
      intra_range:
        description: "5分足の取得範囲 (target=intra のバックフィル用。例 5d / 60d。Yahoo上限60d)"
        type: string
        default: "60d"

concurrency:
  group: vwap-ingest
  cancel-in-progress: false

permissions:
  contents: read
  issues: write  # 失敗時に Issue を立てるため

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 300 # 60d バックフィル/日足+5分足 の逐次全銘柄は実測で 2-3h 域。GH 上限 360 内で余裕を持たせる
    env:
      # CONC=1(逐次)だと daily+intra で ~5h(timeout 接近で途中kill)・月数千分。stock-sync と同じ
      # CONC=5 並列にして 1パス ~30分(daily+intra ~1h)へ短縮し、timeout/無料枠の両方を解消する。
      # Yahoo は YAHOO_PROXY_BASE(Cloudflare エッジ)経由なので並列でも runner IP は 429 対象外、
      # かつ Yahoo 側 429 は MAX_RL=5 連続中断ガードで保護(stock-sync が CONC=5 で実証済み)。
      CONC: "5"
      DELAY_MS: "300"
      YAHOO_PROXY_BASE: ${{ secrets.YAHOO_PROXY_BASE }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # packageManager (pnpm@9.15.9) を読む

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 日足10年 + 5分足 (月水金 cron または dispatch=daily-intra/all)
      - name: VWAP daily + intra → R2
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '0 8 * * 1,3,5') ||
          (github.event_name == 'workflow_dispatch' &&
            (github.event.inputs.target == 'daily-intra' || github.event.inputs.target == 'all'))
        run: |
          pnpm ingest:vwap-daily
          pnpm ingest:vwap-intra

      # 5分足のみ (dispatch=intra)。intra_range で 60d バックフィル可能 (Yahoo上限60d)。
      # daily を伴わないので所要時間を抑えられる。以後は平日 cron の 5d 延伸が引き継ぐ。
      - name: VWAP intra backfill → R2
        if: >-
          github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'intra'
        env:
          INTRA_RANGE: ${{ github.event.inputs.intra_range }}
        run: pnpm ingest:vwap-intra

      # 信用残高 週次 (土 cron または dispatch=margin/all)
      - name: VWAP margin (weekly) → R2
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '0 9 * * 6') ||
          (github.event_name == 'workflow_dispatch' &&
            (github.event.inputs.target == 'margin' || github.event.inputs.target == 'all'))
        run: pnpm ingest:vwap-margin
      - name: 失敗したら Issue を立てる
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: "[ジョブ失敗] ${{ github.workflow }}"
          summary: "${{ github.workflow }} が失敗しました。"
