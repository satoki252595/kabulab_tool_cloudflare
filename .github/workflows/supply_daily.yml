# 毎営業日 12:17 JST (日証金の確報は 11 時頃公表。1 時間強の余裕を取る)。cron は UTC 表記。
# 分を 17 にしているのは、毎時0分が最も混雑して GitHub のスケジュール遅延が大きいため
# (edinet_daily で +3.5h〜+9.5h の遅延を実測した)。
# なお本ジョブのデータ基準日は CSV 内の「申込日」から取るので、起動が遅延しても
# 基準日はずれない。
name: supply_daily

on:
  # schedule は Wave 5（週末カットオーバー）で有効化する。元: cron: "17 3 * * 1-5"
  workflow_dispatch:

concurrency:
  group: supply_daily
  cancel-in-progress: false

permissions:
  contents: read
  issues: write  # 失敗時に Issue を立てるため

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Sync dependencies
        run: nix develop -c bash -c 'cd pipeline && uv sync --frozen'
      - name: Run supply_daily
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_STOCK_MASTER: ${{ secrets.NOTION_DB_STOCK_MASTER }}
          NOTION_DB_FINANCIALS: ${{ secrets.NOTION_DB_FINANCIALS }}
          NOTION_DB_DISCLOSURES: ${{ secrets.NOTION_DB_DISCLOSURES }}
          NOTION_DB_RAW_FILES: ${{ secrets.NOTION_DB_RAW_FILES }}
          # Cloudflare 正本 (R2 + D1)。未設定なら原本保存のみで系列は書かない。
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: nix develop -c bash -c 'cd pipeline && uv run python -m jp_stock_pipeline.jobs.supply_daily'

      - name: 失敗したら Issue を立てる
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: "[ジョブ失敗] ${{ github.workflow }}"
          summary: "${{ github.workflow }} が失敗しました。"
