# 毎営業日12:17 JSTにCFが起動。予定日を固定し、CSVの申込日は原本から読む。
name: supply_daily

on:
  workflow_dispatch:
    inputs:
      scheduled_at:
        description: "CF専用の予定UTC時刻 YYYY-MM-DDTHH:mm:00Z。手動実行は空"
        type: string
        default: ""

concurrency:
  group: supply_daily
  cancel-in-progress: false
  queue: max

permissions:
  actions: read
  contents: read
  issues: write  # 失敗時に Issue を立てるため

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/record-job-clock
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false
      - name: Sync dependencies
        run: nix develop -c bash -c 'cd pipeline && uv sync --frozen'
      - name: Run supply_daily
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_STOCK_MASTER: ${{ secrets.NOTION_DB_STOCK_MASTER }}
          NOTION_DB_FINANCIALS: ${{ secrets.NOTION_DB_FINANCIALS }}
          NOTION_DB_DISCLOSURES: ${{ secrets.NOTION_DB_DISCLOSURES }}
          NOTION_DB_RAW_FILES: ${{ secrets.NOTION_DB_RAW_FILES }}
          # Cloudflare 正本 (R2 + D1)。不足設定は取得前に停止。
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_RAW: ${{ secrets.R2_BUCKET_RAW }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          SCHEDULED_AT: ${{ inputs.scheduled_at }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${SCHEDULED_AT:-}" ]; then args+=(--scheduled-at "$SCHEDULED_AT" --job-started-at "$BATCH_JOB_STARTED_AT"); fi
          nix develop -c bash -c 'cd pipeline && uv run python -m jp_stock_pipeline.jobs.supply_daily --require-cloud "$@"' _ "${args[@]}"

      - name: 失敗したら Issue を立てる
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: "[ジョブ失敗] ${{ github.workflow }}"
          summary: "${{ github.workflow }} が失敗しました。"
