# 005 EDINET(有報) + 006 TDnet(適時開示) + 005 biztag の日次キャッチアップを
# GitHub Actions で実行。
#
# - TDnet(006): PDF センチメントが kuromoji(Node 専用)依存のため Node で実行し
#   D1 へ HTTP API で書く。取込元 TDnet はホストが異なり 429 されないのでプロキシ不要。
# - EDINET(005): Node が共通取込を直接実行。D1 HTTP atomic sender と既存 Notion 保管を使用。
# - biztag(005): Mac LaunchAgentへ移管。適格な新規初回・実入力変更だけローカルClef-Flash。
#   既存判断と根拠は保持し、本文/機械同期はモデル0。機械タグにAI確率を付けない。
#   有料AI・語彙審査・自動競合判定は停止を維持する。
#
# Cloudflare Cronが平日19JSTにmainへ1回dispatch。Mac20時writerより前に終了する。
#
# 必要な GitHub Secrets:
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / D1_DATABASE_ID … TDnet の D1 REST 書込
#   NOTION_TOKEN / NOTION_ARCHIVE_PAGE_ID / NOTION_YUHO_TEXT_DB_ID  … 一次データ Notion アーカイブ(ルール6)
#   EDINET_API_KEY … EDINET API v2 (backfill と同じ Secret)
# biztagの補足DB/台帳はMacの唯一writerだけが更新する。
name: catchup

on:
  workflow_dispatch:
    inputs:
      target:
        description: "実行対象"
        type: choice
        default: all
        options:
          - all
          - tdnet
          - edinet
          - biztag
          - scheduled-catchup
      scheduled_date:
        description: "CF定時起動の予定日 (YYYY-MM-DD)。scheduled-catchupで必須"
        type: string
        required: false

concurrency:
  group: catchup
  cancel-in-progress: false

permissions:
  contents: read
  issues: write  # 失敗時に Issue を立てるため

jobs:
  catchup:
    if: "!cancelled() && github.event_name == 'workflow_dispatch' && github.event.inputs.target != 'biztag'"
    runs-on: ubuntu-latest
    # 初回資格<=19:05、job開始<=初回資格。54分で19:59までに外部cancelする。
    # 手動targetは従来60分。CPUbusyもNode内timerに頼らない。
    timeout-minutes: ${{ github.event.inputs.target == 'scheduled-catchup' && 54 || 60 }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_ARCHIVE_PAGE_ID: ${{ secrets.NOTION_ARCHIVE_PAGE_ID }}
      NOTION_YUHO_TEXT_DB_ID: ${{ secrets.NOTION_YUHO_TEXT_DB_ID }}
      NOTION_STOCK_HOLDINGS_DB_ID: ${{ secrets.NOTION_STOCK_HOLDINGS_DB_ID }}
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      # Nodeだけが保存価格snapshotを読む。既存正常R2権限を再利用し、Workerへは渡さない。
      R2_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: catchup起動資格
        run: pnpm exec tsx scripts/sync/catchup-launch.ts

      # 共通保存資格はTDnet/EDINET双方の取得前に確認。失敗時は後続取得0。
      - name: D1 / Notion 共通設定の事前確認
        run: >-
          pnpm exec tsx -e 'import "dotenv/config";
          import {sharedEnv} from "./src/shared/env.ts";
          import {notionEnv} from "./src/shared/notion-archive/env.ts";
          try { sharedEnv.CLOUDFLARE_API_TOKEN(); sharedEnv.CLOUDFLARE_ACCOUNT_ID(); sharedEnv.D1_DATABASE_ID();
          notionEnv.NOTION_TOKEN(); notionEnv.NOTION_ARCHIVE_PAGE_ID(); }
          catch { console.error("D1/Notion共通設定が不足または不正。取得前に停止しました。"); process.exit(1); }'

      # 006 TDnet 適時開示 (Node + kuromoji → D1 HTTP)
      - name: ir-catalog TDnet catchup
        id: tdnet
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.target == 'tdnet' || github.event.inputs.target == 'all' || github.event.inputs.target == 'scheduled-catchup')
        run: pnpm ingest:ir-tdnet

      # 005 EDINET 有報 (Node + D1 HTTP atomic sender)。受注と海外売上を
      # 同じ有報 1 通から並行構造化するため、本ステップ 1 つで両方が取り込まれる。
      - name: yuho-quant EDINET catchup (受注 + 海外売上)
        if: >-
          success() &&
          github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.target == 'edinet' || github.event.inputs.target == 'all' || github.event.inputs.target == 'scheduled-catchup')
        run: pnpm ingest:yuho-edinet

      # 定期ジョブの失敗に気づく唯一の経路。これまで 14 workflow に
      # `if: failure()` も webhook も 0 行で、JPX の 404 で母集団同期が
      # 1 ヶ月止まっていたことに誰も気づかなかった。
      # 通知先を増やすと見なくなるので、GitHub Issue を 1 本だけ立てる
      # （既に open があれば重複を作らずコメントを足す）。
      - name: 失敗したら Issue を立てる
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: "[ジョブ失敗] ${{ github.workflow }}"
          summary: "${{ github.workflow }} が失敗しました。"

  # LinuxではMLXを実行しない。scheduleのbiztagはMacの20:00 JSTに移管。
  # 手動target=biztag/allも取得前に止め、二重writerを作らない。
  biztag:
    needs: catchup
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.target == 'biztag' || github.event.inputs.target == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Mac専用biztag writerへ案内して取得前停止
        run: |
          echo "biztagは承認済みmainのMac LaunchAgentへ移管済みです。Linuxからは取得・保存しません。docs/005-biztag-local-runtime.mdを参照してください。" >&2
          exit 1
