# 明示bulk専用。⑤hosted原本だけを読み、通常cron/source取得へ接続しない。
name: raw_index_backfill
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect: 旧receipt/最大2原本の読取のみ、dry: 欠測計画、apply: CAS保存と索引補完"
        type: choice
        options: [dry, apply, inspect]
        default: dry
      plan_id:
        description: "再開時は同じID。別IDで先行unknownを迂回しない"
        type: string
        default: canonical-20261014
      cutoff:
        description: "固定集合のUTC ISO締切（Z終端）。dry/apply/再開で同じ実値を明示"
        type: string
        required: true
      expected_count:
        description: "固定cutoffでの⑤canonical期待件数。不一致は書込前に停止"
        type: string
        required: true
      limit:
        description: "最大件数。inspectは1〜2のみ（PUT/INSERT/continuation禁止）"
        type: string
        default: "50"
      max_bytes:
        description: "転送予算bytes。inspectはreceipt/原本のR2 GET総64MiB、manifest1回（D1 bytes別）"
        type: string
        default: "67108864"
      max_seconds:
        description: "開始時間予算秒。inspectは最大600秒/各request前65秒headroom"
        type: string
        default: "1200"
      continue_runs:
        description: "成功後に同じ固定集合を継続する残run上限(0で単発)。最大200、各run500件/2GiB/新規開始3600秒以下"
        type: string
        default: "0"
      reconcile_sha256:
        description: "人間判断後の単一index_inflight回復だけ。apply/limit1/両SHA必須、通常は空欄"
        type: string
        default: ""
      reconcile_state_sha256:
        description: "旧state.jsonの全bytes SHA256。intent既存/競合/結果不明は再送せず停止"
        type: string
        default: ""
concurrency:
  group: raw_index_backfill
  cancel-in-progress: false
permissions:
  contents: read
  actions: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false
      - name: Sync Node dependencies
        run: nix develop -c pnpm install --frozen-lockfile
      - name: Verify or publish existing canonical originals
        env:
          MODE: ${{ inputs.mode }}
          PLAN_ID: ${{ inputs.plan_id }}
          EXPECTED_COUNT: ${{ inputs.expected_count }}
          CUTOFF: ${{ inputs.cutoff }}
          LIMIT: ${{ inputs.limit }}
          MAX_BYTES: ${{ inputs.max_bytes }}
          MAX_SECONDS: ${{ inputs.max_seconds }}
          RECONCILE_SHA256: ${{ inputs.reconcile_sha256 }}
          RECONCILE_STATE_SHA256: ${{ inputs.reconcile_state_sha256 }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_RAW_FILES: ${{ secrets.NOTION_DB_RAW_FILES }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          R2_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_RAW: ${{ secrets.R2_BUCKET_RAW }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -m 700 -p tmp/raw-index
          reconcile_args=()
          if [ -n "$RECONCILE_SHA256" ] || [ -n "$RECONCILE_STATE_SHA256" ]; then
            reconcile_args+=("--reconcile-sha256=$RECONCILE_SHA256" "--reconcile-state-sha256=$RECONCILE_STATE_SHA256")
          fi
          nix develop -c pnpm exec tsx scripts/notion/raw-index-backfill.ts \
            "--mode=$MODE" "--plan-id=$PLAN_ID" "--expected-count=$EXPECTED_COUNT" "--cutoff=$CUTOFF" \
            "--limit=$LIMIT" "--max-bytes=$MAX_BYTES" "--max-seconds=$MAX_SECONDS" \
            --notion-max-rps=0.25 --out=tmp/raw-index/receipt.jsonl "${reconcile_args[@]}"
      # raw body/manifest/private receipt はartifactへ公開しない。再開stateはR2へCAS保管。
      - name: Continue the same verified snapshot within the explicit run budget
        if: ${{ success() && inputs.mode == 'apply' && inputs.continue_runs != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          nix develop -c python3 scripts/notion/raw-index-continue.py \
            "$GITHUB_EVENT_PATH" tmp/raw-index/receipt.jsonl tmp/raw-index/continuation.json
          if [ -f tmp/raw-index/continuation.json ]; then
            # Dispatch is single-attempt. An unknown API result is never resent automatically.
            gh api --method POST "repos/$GH_REPO/actions/workflows/raw_index_backfill.yml/dispatches" \
              --input tmp/raw-index/continuation.json
          fi
