# Saved-source publishing only. No EDINET/Yahoo fetch, vocabulary review or model runtime.
name: mechanical-publishing
on:
  schedule:
    - cron: "17 19 * * *" # Daily 04:17 JST; uses latest saved input at actual start, no trading-day fiction.
  workflow_dispatch:
    inputs:
      target:
        description: "有限の機械同期"
        type: choice
        default: all
        options: [all, supplement, yutai]
concurrency:
  group: mechanical-publishing
  cancel-in-progress: false
  queue: max
permissions:
  contents: read
  actions: read
# Same existing raw bucket as the accepted Mac .env. Root explicitly bootstraps the
# canonical old journals before enabling MECHANICAL_PUBLISHING_ENABLED=true.
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
  NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
  NOTION_ARCHIVE_PAGE_ID: ${{ secrets.NOTION_ARCHIVE_PAGE_ID }}
  NOTION_STOCK_INFO_PAGE_ID: ${{ secrets.NOTION_STOCK_INFO_PAGE_ID }}
  NOTION_YUHO_TEXT_DB_ID: ${{ secrets.NOTION_YUHO_TEXT_DB_ID }}
  NOTION_DB_STOCK_MASTER: ${{ secrets.NOTION_DB_STOCK_MASTER }}
  NOTION_MAX_RPS: "0.8"
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET_RAW: ${{ secrets.R2_BUCKET_RAW }}
jobs:
  supplement:
    if: github.ref == 'refs/heads/main' && vars.MECHANICAL_PUBLISHING_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == 'supplement')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/record-job-clock
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 本文39・基本補足（最大50社・新規開始10分＋閉鎖5分）
        run: pnpm sync:mechanical --target=supplement --limit=50 --budget-min=10
  yutai:
    needs: supplement
    # A known body HOLD is not a semantic dependency. Unknown shared owner blocks this
    # target before dependencies/source generation, even if the first job failed.
    if: "!cancelled() && github.ref == 'refs/heads/main' && vars.MECHANICAL_PUBLISHING_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == 'yutai')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/record-job-clock
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 優待機械要約（最大60群・モデル禁止）
        run: pnpm sync:mechanical --target=yutai --limit=60 --budget-min=15 --state-dir="${{ runner.temp }}/yutai-mechanical"
