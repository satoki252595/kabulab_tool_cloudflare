# 株価 日次/月次 sync を GitHub Actions(Node)で実行 → D1。
#
# Workers Paid を使わない運用。指標/スコア計算は Node で行い、D1 へは createD1HttpDb
# (D1 REST) で書き込む。Yahoo は共有クライアントが YAHOO_PROXY_BASE(Cloudflare エッジの
# /api/ingest/yahoo)経由で叩くため、GitHub ランナーの IP が 429 されることはない。
#
# default ブランチ(main)から発火する(schedule は main のワークフローのみ)。
#
# 必要な GitHub Secrets:
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / D1_DATABASE_ID … D1 REST 書込
#   YAHOO_PROXY_BASE … デプロイ済み Worker の URL (例 https://kabulab-cf.<sub>.workers.dev)
#   CRON_SECRET      … Worker secret と同値 (取込プロキシ認証)
#   NOTION_TOKEN / NOTION_BACKUP_PAGE_ID / NOTION_TRASH_PAGE_ID … 月次 universe の
#     JPX XLS 一次データ Notion アーカイブ(ルール6)用
#
# 日次 ~3,700 銘柄は ~40-50 分/回 (public repo のため Actions 分課金は無し)。
#    平日毎日 + VWAP と合わせると枠に近づくため、必要なら cron を Mon/Wed/Fri 等へ間引く。
name: stock-sync

on:
  schedule:
    - cron: "0 21 * * 1-5" # 平日 21:00 UTC (翌 06:00 JST・東証 EOD 確定後): 日次 sync
    # JPX data_j.xlsx は毎月第3営業日以降に前月末版へ差し替わる。
    # 月初の旧版取得を避け、毎月10日 10:30 JST に母集団同期する。
    - cron: "30 1 10 * *"
  workflow_dispatch:
    inputs:
      target:
        description: "実行対象"
        type: choice
        default: daily
        options:
          - daily
          - monthly
          - all

concurrency:
  group: stock-sync
  cancel-in-progress: false

permissions:
  contents: read
  issues: write  # 失敗時に Issue を立てるため

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      YAHOO_PROXY_BASE: ${{ secrets.YAHOO_PROXY_BASE }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_BACKUP_PAGE_ID: ${{ secrets.NOTION_BACKUP_PAGE_ID }}
      NOTION_TRASH_PAGE_ID: ${{ secrets.NOTION_TRASH_PAGE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 日次 sync (平日 cron または dispatch=daily/all)
      - name: stock daily sync
        id: daily
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '0 21 * * 1-5') ||
          (github.event_name == 'workflow_dispatch' &&
            (github.event.inputs.target == 'daily' || github.event.inputs.target == 'all'))
        run: pnpm sync:daily:core

      # 月次: 母集団(JPX)同期 → otakara rebuild (月次 cron または dispatch=monthly/all)
      - name: monthly universe + rebuild
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '30 1 10 * *') ||
          (github.event_name == 'workflow_dispatch' &&
            (github.event.inputs.target == 'monthly' || github.event.inputs.target == 'all'))
        run: |
          pnpm sync:universe
          pnpm sync:monthly:core
      - name: 失敗したら Issue を立てる
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: "[ジョブ失敗] ${{ github.workflow }}"
          summary: "${{ github.workflow }} が失敗しました。"
      # 失敗率 ≤1% の成功扱い (L-57) の trace。成功は成功だが、失敗が 0 ではない
      # run を Issue へ記録する (恒久失敗の混入・回収漏れの早期発見用)。
      - name: 許容内失敗があれば Issue にコメント
        if: success() && steps.daily.outputs.tolerated_failures != ''
        uses: ./.github/actions/notify-failure
        with:
          title: "[ジョブ失敗] ${{ github.workflow }}"
          summary: "${{ github.workflow }} は成功扱い (失敗率 1% 以下) ですが、許容内失敗が ${{ steps.daily.outputs.tolerated_failures }} 件ありました。"
