# 株式・マクロ・月次取得。起動/先行条件/保存契約は docs/production-job-inventory.md。
name: stock-sync

on:
  schedule:
    # 株式の旧 cron (13 17 * * 1-5) は廃止。起動は CF Cron Trigger
    # (wrangler.toml [triggers] 0 9 MON-FRI = 18:00 JST) が workflow_dispatch
    # target=scheduled-stocks で行う (docs/stock-scheduler.md)。
    # 株式guard同一N225原本+VI1GETをJP legとしてR2/Notionへ保管。
    # マクロはCF21:00UTCに同予定日JP leg再読+米3GET、22:05UTCにreceipt期限確認。
    # JPX data_j.xlsx は毎月第3営業日以降に前月末版へ差し替わる。
    # 月初の旧版取得を避け、毎月10日 10:30 JST に母集団同期する。
    - cron: "30 1 10 * *"
  workflow_dispatch:
    inputs:
      target:
        description: "実行対象"
        type: choice
        default: daily
        options:
          - daily
          - stocks
          - scheduled-stocks
          - scheduled-context
          - context
          - monthly
          - all
      scheduled_date:
        description: "CF予定UTC日。stocksは実18〜20時開始/23:30新規IO締切、contextは既存朝窓"
        type: string
        default: ""
      scheduled_at:
        description: "CF controller.scheduledTime のUTC。定時の起動受付に使う。空は定時targetを止める"
        type: string
        default: ""

concurrency:
  group: stock-sync
  cancel-in-progress: false
  # 既定 queue:single は pending を1件だけ残し、次の pending が先の pending を cancel する。
  # queue:max は最大100件まで待たせる（cancel-in-progress: true とは併用不可）。
  queue: max

permissions:
  actions: read # reusable moneyflowの実job開始時計にも必要。
  contents: read
  issues: write  # 失敗時に Issue を立てるため

jobs:
  sync:
    # producerだけが保持し、stock-syncのreusable moneyflow呼出し前に解放する。
    concurrency:
      group: yahoo-source
      cancel-in-progress: false
      queue: max # pending同士の後着cancelを防ぐ。Yahoo取得は引き続き1 jobずつ。
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 各段階は元job時計を引継ぎ、native終了前にsource停止/原本閉鎖。
    # 株式 step の実成功出力 (後続 moneyflow の起動条件)。step skip 時は空。
    outputs:
      trade_date: ${{ steps.daily.outputs.trade_date }}
      tolerated_failures: ${{ steps.daily.outputs.tolerated_failures }}
    env:
      NOTION_MAX_RPS: "1.6"
      NOTION_RPS: "1.6" # 同じYahoo job内のsector33 Pythonも同じ予約枠。
      JPX_EX_RIGHTS_URL: ${{ vars.JPX_EX_RIGHTS_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      # 月次優待source importも同じ非期限共有publisherを使用。初回Mac移行が先。
      R2_BUCKET_RAW: ${{ secrets.R2_BUCKET_RAW }}
      YAHOO_PROXY_BASE: ${{ secrets.YAHOO_PROXY_BASE }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_ARCHIVE_PAGE_ID: ${{ secrets.NOTION_ARCHIVE_PAGE_ID }}
      NOTION_YUHO_TEXT_DB_ID: ${{ secrets.NOTION_YUHO_TEXT_DB_ID }}
      NOTION_STOCK_INFO_PAGE_ID: ${{ secrets.NOTION_STOCK_INFO_PAGE_ID }}
      NOTION_PRICE_SYNC_DB_ID: ${{ secrets.NOTION_PRICE_SYNC_DB_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/record-job-clock

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate invocation
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TARGET: ${{ github.event.inputs.target }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch)
              case "$DISPATCH_TARGET" in
                daily|stocks|all|scheduled-stocks|scheduled-context|context|monthly) ;;
                *) echo "::error::unknown dispatch target: $DISPATCH_TARGET"; exit 1 ;;
              esac ;;
            schedule)
              case "$EVENT_SCHEDULE" in
                "30 1 10 * *") ;;
                *) echo "::error::unknown schedule: $EVENT_SCHEDULE"; exit 1 ;;
              esac ;;
            *) echo "::error::unknown event: $EVENT_NAME"; exit 1 ;;
          esac

      # 株式は一日一度。米指数の取引中価格を朝のマクロへ上書きしない。
      # 旧 schedule 起動は廃止。CF scheduler が target=scheduled-stocks で叩く。
      - name: stock daily sync
        id: daily
        if: >-
          github.event_name == 'workflow_dispatch' &&
            (github.event.inputs.target == 'daily' || github.event.inputs.target == 'stocks' || github.event.inputs.target == 'scheduled-stocks' || github.event.inputs.target == 'all')
        env:
          SCHEDULED_DATE: ${{ github.event.inputs.scheduled_date }}
          SCHEDULED_AT: ${{ github.event.inputs.scheduled_at }}
          STOCK_SYNC_TARGET: ${{ github.event.inputs.target }}
        run: pnpm sync:daily:core --stocks-only --yahoo-direct

      # sector33は価格非依存。株式処理が失敗しても実行し、context/monthlyでは実行しない。
      # 同じjobのYahoo/Notion通信枠と、moneyflowの価格資格条件は維持する。
      - uses: DeterminateSystems/nix-installer-action@main
        if: always() && !cancelled() && (steps.daily.outcome == 'success' || steps.daily.outcome == 'failure')
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false
        if: always() && !cancelled() && (steps.daily.outcome == 'success' || steps.daily.outcome == 'failure')
      - name: Sync pipeline dependencies
        if: always() && !cancelled() && (steps.daily.outcome == 'success' || steps.daily.outcome == 'failure')
        run: nix develop -c bash -c 'cd pipeline && uv sync --frozen'
      - name: sector33 sync
        if: always() && !cancelled() && (steps.daily.outcome == 'success' || steps.daily.outcome == 'failure')
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ARCHIVE_PAGE_ID: ${{ secrets.NOTION_ARCHIVE_PAGE_ID }}
        run: nix develop -c bash -c 'cd pipeline && uv run python -m jp_stock_pipeline.jobs.sector33_sync --job-started-at "$BATCH_JOB_STARTED_AT"'

      - name: market context sync
        if: >-
          github.event_name == 'workflow_dispatch' &&
            (github.event.inputs.target == 'daily' || github.event.inputs.target == 'context' || github.event.inputs.target == 'scheduled-context' || github.event.inputs.target == 'all')
        env:
          SCHEDULED_DATE: ${{ github.event.inputs.scheduled_date }}
          SCHEDULED_AT: ${{ github.event.inputs.scheduled_at }}
          STOCK_SYNC_TARGET: ${{ github.event.inputs.target }}
        run: pnpm sync:daily:core --context-only

      # 月次: 母集団 → 優待原文取得/物理照合 → 派生再計算。
      # 要約は独立Linux定期。原文importも同じR2共有gateの明示移行が先。
      - name: monthly universe + benefits + rebuild
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '30 1 10 * *') ||
          (github.event_name == 'workflow_dispatch' &&
            (github.event.inputs.target == 'monthly' || github.event.inputs.target == 'all'))
        run: |
          pnpm sync:universe
          pnpm yutai:fetch
          pnpm sync:monthly:core
      - name: 失敗したら Issue を立てる
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: "[ジョブ失敗] ${{ github.workflow }}"
          summary: "${{ github.workflow }} が失敗しました。"
      # 失敗率 ≤1% の成功扱い (L-57) の trace。成功は成功だが、失敗が 0 ではない
      # run を Issue へ記録する (恒久失敗の混入・回収漏れの早期発見用)。
      - name: 許容内失敗があれば Issue にコメント
        if: success() && steps.daily.outputs.tolerated_failures != ''
        uses: ./.github/actions/notify-failure
        with:
          title: "[ジョブ失敗] ${{ github.workflow }}"
          summary: "${{ github.workflow }} は成功扱い (失敗率 1% 以下) ですが、許容内失敗が ${{ steps.daily.outputs.tolerated_failures }} 件ありました。"

  # moneyflow 連鎖 (#160): 株式 sync の実成功時のみ後続する。
  # trade_date 空 (context-only/macro・monthly の run で daily step が skip) や
  # 許容内失敗あり (tolerated false-green) では起動しない。週次集計は冪等
  # upsert のため、skip 日の分は次回成功日の連鎖で週累積として書かれる。
  moneyflow:
    needs: sync
    if: needs.sync.outputs.trade_date != '' && needs.sync.outputs.tolerated_failures == ''
    uses: ./.github/workflows/moneyflow.yml
    with:
      trade_date: ${{ needs.sync.outputs.trade_date }}
      only: sector-turnover
    secrets: inherit
    permissions:
      actions: read
      contents: read
      issues: write
