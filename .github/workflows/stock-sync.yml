# 株価 日次/月次 sync を GitHub Actions(Node)で実行 → D1。
#
# 指標/スコア計算は Node で行い、D1 へは createD1HttpDb
# (D1 REST) で書き込む。Yahoo は共有クライアントが YAHOO_PROXY_BASE(Cloudflare エッジの
# /api/ingest/yahoo)経由で叩く。D1とプロキシの利用はCloudflareの包含枠/従量料金の対象。
# proxy経由でも上流の429等は起こり得る。失敗は原本とともに記録して停止する。
#
# default ブランチ(main)から発火する(schedule は main のワークフローのみ)。
#
# 必要な GitHub Secrets:
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / D1_DATABASE_ID … D1 REST 書込
#   YAHOO_PROXY_BASE … デプロイ済み Worker の URL (例 https://kabulab-cf.<sub>.workers.dev)
#   CRON_SECRET      … Worker secret と同値 (取込プロキシ認証)
#   NOTION_TOKEN / NOTION_ARCHIVE_PAGE_ID / NOTION_YUHO_TEXT_DB_ID … 月次 universe の
#     JPX XLS 一次データ Notion アーカイブ(ルール6)用
#   NOTION_STOCK_INFO_PAGE_ID … 日次 sync 完了を「株価の日次同期」DB へ記録する
#     ための親ページ (005 yuho-quant の「株式情報」ページと共通。契約書参照)
#   NOTION_PRICE_SYNC_DB_ID … 上記 DB を ID 固定する場合のみ (任意。未設定なら自動発見/作成)
#
# 日次は銘柄ごとに直列取得。実HTTPは共有clientで1秒間隔、初回429/503で停止。
#    timeoutは210分だが21UTC書込期限は維持。原本保管を含む全量時間は未測定。
#
# 株式 sync の実成功後は moneyflow を workflow_call で連鎖する (#160)。
# 実 tradingDate を固定入力し、許容内失敗ありは受け入れない。失敗 producer の
# 時は moneyflow を起動しない (needs の成功要求 + 下記の outputs 条件)。
name: stock-sync

on:
  schedule:
    # 株式の旧 cron (13 17 * * 1-5) は廃止。起動は CF Cron Trigger
    # (wrangler.toml [triggers] 13 17 MON-FRI) が workflow_dispatch
    # target=scheduled-stocks で行う (docs/stock-scheduler.md)。
    # マクロ起動も CF 21:00 UTC に移行し、22:05 UTC に別receiptで期限確認する。
    # JPX data_j.xlsx は毎月第3営業日以降に前月末版へ差し替わる。
    # 月初の旧版取得を避け、毎月10日 10:30 JST に母集団同期する。
    - cron: "30 1 10 * *"
  workflow_dispatch:
    inputs:
      target:
        description: "実行対象"
        type: choice
        default: daily
        options:
          - daily
          - stocks
          - scheduled-stocks
          - scheduled-context
          - context
          - monthly
          - all
      scheduled_date:
        description: "CF scheduler が渡す予定UTC日 (YYYY-MM-DD)。定時stocks/context用"
        type: string
        default: ""

concurrency:
  group: stock-sync
  cancel-in-progress: false

permissions:
  contents: read
  issues: write  # 失敗時に Issue を立てるため

jobs:
  sync:
    # producerだけが保持し、stock-syncのreusable moneyflow呼出し前に解放する。
    concurrency:
      group: yahoo-source
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 210
    # 株式 step の実成功出力 (後続 moneyflow の起動条件)。step skip 時は空。
    outputs:
      trade_date: ${{ steps.daily.outputs.trade_date }}
      tolerated_failures: ${{ steps.daily.outputs.tolerated_failures }}
      moneyflow_only: ${{ steps.moneyflow_only.outputs.only }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      YAHOO_PROXY_BASE: ${{ secrets.YAHOO_PROXY_BASE }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_ARCHIVE_PAGE_ID: ${{ secrets.NOTION_ARCHIVE_PAGE_ID }}
      NOTION_YUHO_TEXT_DB_ID: ${{ secrets.NOTION_YUHO_TEXT_DB_ID }}
      NOTION_STOCK_INFO_PAGE_ID: ${{ secrets.NOTION_STOCK_INFO_PAGE_ID }}
      NOTION_PRICE_SYNC_DB_ID: ${{ secrets.NOTION_PRICE_SYNC_DB_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # moneyflow 連鎖の取得元 selector (producer 起動前に確定)。
      # dispatch=stocks (手動) → sector-turnover のみ。dispatch=scheduled-stocks
      # (CF scheduler) は旧 scheduled 株式 run と同じ明示の空文字 (moneyflow
      # 既存の全取得元を維持)。daily/all・残 schedule → 明示の空文字。
      # context/monthly → 連鎖なし (trade_date 空で起動しない。値は空)。
      # 未知 event/target/schedule は producer 起動前に非0停止する。
      # 未知を空文字へ落とす fallback は禁止 (下の *)。
      - name: moneyflow only selector
        id: moneyflow_only
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TARGET: ${{ github.event.inputs.target }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          ONLY=""
          case "$EVENT_NAME" in
            workflow_dispatch)
              case "$DISPATCH_TARGET" in
                stocks) ONLY="sector-turnover" ;;
                daily|all|scheduled-stocks|scheduled-context|context|monthly) ONLY="" ;;
                *) echo "::error::unknown dispatch target: $DISPATCH_TARGET"; exit 1 ;;
              esac ;;
            schedule)
              case "$EVENT_SCHEDULE" in
                "30 1 10 * *") ONLY="" ;;
                *) echo "::error::unknown schedule: $EVENT_SCHEDULE"; exit 1 ;;
              esac ;;
            *) echo "::error::unknown event: $EVENT_NAME"; exit 1 ;;
          esac
          echo "only=${ONLY}" >> "$GITHUB_OUTPUT"

      # 株式は一日一度。米指数の取引中価格を朝のマクロへ上書きしない。
      # 旧 schedule 起動は廃止。CF scheduler が target=scheduled-stocks で叩く。
      - name: stock daily sync
        id: daily
        if: >-
          github.event_name == 'workflow_dispatch' &&
            (github.event.inputs.target == 'daily' || github.event.inputs.target == 'stocks' || github.event.inputs.target == 'scheduled-stocks' || github.event.inputs.target == 'all')
        env:
          SCHEDULED_DATE: ${{ github.event.inputs.scheduled_date }}
          STOCK_SYNC_TARGET: ${{ github.event.inputs.target }}
        run: pnpm sync:daily:core --stocks-only

      # sector33 のみ同期。株式 daily 成功＋trade_date 非空の直後、moneyflow 前。
      # context/monthly 単独では daily が skip されるため走らない。
      # 失敗 (partial 含む) は sync job を落として moneyflow を止める。
      - uses: DeterminateSystems/nix-installer-action@main
        if: steps.daily.conclusion == 'success' && steps.daily.outputs.trade_date != ''
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false
        if: steps.daily.conclusion == 'success' && steps.daily.outputs.trade_date != ''
      - name: Sync pipeline dependencies
        if: steps.daily.conclusion == 'success' && steps.daily.outputs.trade_date != ''
        run: nix develop -c bash -c 'cd pipeline && uv sync --frozen'
      - name: sector33 sync
        if: steps.daily.conclusion == 'success' && steps.daily.outputs.trade_date != ''
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ARCHIVE_PAGE_ID: ${{ secrets.NOTION_ARCHIVE_PAGE_ID }}
        run: nix develop -c bash -c 'cd pipeline && uv run python -m jp_stock_pipeline.jobs.sector33_sync'

      - name: market context sync
        if: >-
          github.event_name == 'workflow_dispatch' &&
            (github.event.inputs.target == 'daily' || github.event.inputs.target == 'context' || github.event.inputs.target == 'scheduled-context' || github.event.inputs.target == 'all')
        env:
          SCHEDULED_DATE: ${{ github.event.inputs.scheduled_date }}
          STOCK_SYNC_TARGET: ${{ github.event.inputs.target }}
        run: pnpm sync:daily:core --context-only

      # 月次: 母集団 → 優待原文取得/物理照合 → 派生再計算。
      # 要約はMacの21時定時jobが変更・未要約分だけ処理する（追加有料APIなし）。
      - name: monthly universe + benefits + rebuild
        if: >-
          (github.event_name == 'schedule' && github.event.schedule == '30 1 10 * *') ||
          (github.event_name == 'workflow_dispatch' &&
            (github.event.inputs.target == 'monthly' || github.event.inputs.target == 'all'))
        run: |
          pnpm sync:universe
          pnpm yutai:fetch
          pnpm sync:monthly:core
      - name: 失敗したら Issue を立てる
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: "[ジョブ失敗] ${{ github.workflow }}"
          summary: "${{ github.workflow }} が失敗しました。"
      # 失敗率 ≤1% の成功扱い (L-57) の trace。成功は成功だが、失敗が 0 ではない
      # run を Issue へ記録する (恒久失敗の混入・回収漏れの早期発見用)。
      - name: 許容内失敗があれば Issue にコメント
        if: success() && steps.daily.outputs.tolerated_failures != ''
        uses: ./.github/actions/notify-failure
        with:
          title: "[ジョブ失敗] ${{ github.workflow }}"
          summary: "${{ github.workflow }} は成功扱い (失敗率 1% 以下) ですが、許容内失敗が ${{ steps.daily.outputs.tolerated_failures }} 件ありました。"

  # moneyflow 連鎖 (#160): 株式 sync の実成功時のみ後続する。
  # trade_date 空 (context-only/macro・monthly の run で daily step が skip) や
  # 許容内失敗あり (tolerated false-green) では起動しない。週次集計は冪等
  # upsert のため、skip 日の分は次回成功日の連鎖で週累積として書かれる。
  moneyflow:
    needs: sync
    if: needs.sync.outputs.trade_date != '' && needs.sync.outputs.tolerated_failures == ''
    uses: ./.github/workflows/moneyflow.yml
    with:
      trade_date: ${{ needs.sync.outputs.trade_date }}
      only: ${{ needs.sync.outputs.moneyflow_only }}
    secrets: inherit
    permissions:
      contents: read
      issues: write
