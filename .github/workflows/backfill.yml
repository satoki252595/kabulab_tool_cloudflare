# 手動バックフィル起動用 (dispatch のみ・schedule なし)。
#
# 日次上限で取りこぼした分や新設テーブルへの埋め戻しを、無制限・再開可能・
# 冪等な data-script で回収する。全ジョブは public repo のため Actions 分無料。
# Notion への同時書込を抑えるため、多 sh 系統の同時起動は 3 系統以内にする
# (共有 notion-archive クライアントが 429 を再試行するので壊れはしない)。
#
# 必要 secrets: EDINET_API_KEY / CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID /
#   D1_DATABASE_ID / NOTION_TOKEN / NOTION_ARCHIVE_PAGE_ID / NOTION_YUHO_TEXT_DB_ID
#   (ir のみ) YANOSHIN_* 不要 (TDnet 鍵不要)
#   (biztag* のみ) TYPESAFE_API_KEY / NOTION_STOCK_INFO_PAGE_ID / NOTION_DB_STOCK_MASTER /
#     NOTION_STOCK_SUPPLEMENT_DB_ID / NOTION_BIZTAG_LEDGER_DB_ID
#     (docs/005-yuho-quant-business-tags.md §7・§8)
name: backfill

on:
  workflow_dispatch:
    inputs:
      job:
        description: "実行スクリプト"
        required: true
        type: choice
        options:
          - yuho-missing
          - yuho-text
          - ir
          - biztag
          - biztag-golden
          - biztag-rollback
      from:
        description: "開始 (yuho-missing: YYYY-MM-DD / ir: YYYY-MM)"
        required: false
        default: ""
        type: string
      to:
        description: "終了 (yuho-missing: YYYY-MM-DD / ir: YYYY-MM) / biztag-rollback: 巻き戻し先の版 (例 v1)"
        required: false
        default: ""
        type: string
      limit:
        description: "上限件数 (yuho 系・biztag のみ。空=無制限)"
        required: false
        default: ""
        type: string
      offset:
        description: "スキップ件数 (yuho-text の sharding 用)"
        required: false
        default: ""
        type: string
      ticker:
        description: "銘柄絞り (ir のみ)"
        required: false
        default: ""
        type: string
      rejudge_pdf:
        description: "ir: terminal 行も PDF 再取得して再判定+本文保存する"
        required: false
        default: false
        type: boolean
      reason:
        description: "biztag-rollback: 巻き戻す理由 (台帳の理由列に記録される。必須)"
        required: false
        default: ""
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # 6h 上限いっぱい (長時間 backfill 用)
    permissions:
      contents: read
      issues: write # 失敗通知 (notify-failure) のため
    # biztag* (biztag/biztag-golden/biztag-rollback) は Notion「銘柄マスタ
    # （補足）」「事業タグ単語帳（台帳）」に read-check-write で書き込むため、
    # catchup.yml の biztag ジョブおよびこのジョブの他の biztag* 起動と同じ
    # グループで直列化する (同時実行だと「有効な版がちょうど1件」等の
    # check-then-act 前提が壊れ、二重作成・台帳不整合を起こす)。それ以外の
    # job (yuho-missing 等) は biztag の Notion DB に触れないため直列化不要
    # (実行ごとに一意なグループにして事実上の制約無しにする)。
    concurrency:
      group: ${{ contains(fromJson('["biztag","biztag-golden","biztag-rollback"]'), inputs.job) && 'biztag-notion' || format('backfill-other-{0}', github.run_id) }}
      cancel-in-progress: false
    env:
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_ARCHIVE_PAGE_ID: ${{ secrets.NOTION_ARCHIVE_PAGE_ID }}
      NOTION_YUHO_TEXT_DB_ID: ${{ secrets.NOTION_YUHO_TEXT_DB_ID }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      NOTION_STOCK_INFO_PAGE_ID: ${{ secrets.NOTION_STOCK_INFO_PAGE_ID }}
      NOTION_DB_STOCK_MASTER: ${{ secrets.NOTION_DB_STOCK_MASTER }}
      NOTION_STOCK_SUPPLEMENT_DB_ID: ${{ secrets.NOTION_STOCK_SUPPLEMENT_DB_ID }}
      NOTION_BIZTAG_LEDGER_DB_ID: ${{ secrets.NOTION_BIZTAG_LEDGER_DB_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: yuho-missing (取りこぼし回収)
        if: inputs.job == 'yuho-missing'
        run: |
          args="--from=${{ inputs.from }} --to=${{ inputs.to }}"
          [ -n "${{ inputs.limit }}" ] && args="$args --limit=${{ inputs.limit }}"
          pnpm yuho:backfill:missing -- $args
      - name: yuho-text (開示テキスト埋め戻し)
        if: inputs.job == 'yuho-text'
        run: |
          args=""
          [ -n "${{ inputs.limit }}" ] && args="$args --limit=${{ inputs.limit }}"
          [ -n "${{ inputs.offset }}" ] && args="$args --offset=${{ inputs.offset }}"
          pnpm yuho:backfill:text -- $args
      - name: ir (TDnet backfill)
        if: inputs.job == 'ir'
        run: |
          args="--from=${{ inputs.from }} --to=${{ inputs.to }}"
          [ -n "${{ inputs.ticker }}" ] && args="$args --ticker=${{ inputs.ticker }}"
          [ "${{ inputs.rejudge_pdf }}" = "true" ] && args="$args --rejudge-pdf-sentiment"
          pnpm ir:backfill -- $args
      - name: biztag (事業タグ全件バックフィル)
        id: biztag
        if: inputs.job == 'biztag'
        # 手入力の値 (limit) はシェルに直接埋め込まず環境変数で渡す
        # (biztag-rollback と同じ注入対策。値も数字のみに限定する)。
        env:
          BIZTAG_LIMIT: ${{ inputs.limit }}
        run: |
          if [ -n "$BIZTAG_LIMIT" ] && ! [[ "$BIZTAG_LIMIT" =~ ^[0-9]+$ ]]; then
            echo "limit は数字のみ指定できます: $BIZTAG_LIMIT" >&2
            exit 1
          fi
          args="--budget-min=340"
          [ -n "$BIZTAG_LIMIT" ] && args="$args --limit=$BIZTAG_LIMIT"
          pnpm biztag run -- $args
      # 判定失敗ではなく「運営が判断すべきこと」(単語帳の関門停止・提案期限切れ・
      # 再試行上限到達の残件 等) の通知。ジョブ自体は成功のままなので if: failure() では
      # 拾えない (catchup.yml の同名ステップと同じ理由)。job=biztag 以外の
      # dispatch では steps.biztag は生成されず outputs も空なので、この
      # step は何もしない。
      - name: biztag の通知 (関門停止・期限切れ・要確認の残件)
        if: steps.biztag.outputs.notify == 'true'
        uses: ./.github/actions/notify-failure
        with:
          title: ${{ steps.biztag.outputs.notify_title }}
          summary: ${{ steps.biztag.outputs.notify_summary }}
      - name: biztag-golden (ゴールデンセットで精度測定)
        if: inputs.job == 'biztag-golden'
        run: pnpm biztag golden
      - name: biztag-rollback (単語帳を過去の版へ巻き戻す)
        if: inputs.job == 'biztag-rollback'
        # 手入力の値はシェルに直接埋め込まず環境変数で渡す (引用符等で壊れない・注入されない)
        env:
          ROLLBACK_TO: ${{ inputs.to }}
          ROLLBACK_REASON: ${{ inputs.reason }}
        run: |
          if [ -z "$ROLLBACK_TO" ] || [ -z "$ROLLBACK_REASON" ]; then
            echo "biztag-rollback には to (巻き戻し先の版) と reason (理由) の両方が必須です" >&2
            exit 1
          fi
          pnpm biztag rollback -- --to="$ROLLBACK_TO" --reason="$ROLLBACK_REASON"
      - name: 失敗したら Issue を立てる
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: "[ジョブ失敗] ${{ github.workflow }} (${{ inputs.job }})"
          summary: "${{ github.workflow }} (${{ inputs.job }}) が失敗しました。"
