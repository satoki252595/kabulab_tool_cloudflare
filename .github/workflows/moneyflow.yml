# 008 moneyflow の日次取込 (計画: notion-velvet-goose.md)。
#
# stock-sync.yml の株式 sync 成功後に workflow_call で連鎖実行する (#160)。
# 旧来の独立 cron (平日 08:30 UTC) は stock-sync (17:13 UTC) より先に走り、
# 当日分の D1 日足が無いまま sector-turnover を要求して失敗した。cron ずらし
# では再発防止にならない (GitHub の schedule  jitter が数時間ある実測) ため、
# 独立 cron を廃止し、producer の実 tradingDate を固定入力で受けて走る。
# `scripts/moneyflow/ingest.ts` が:
#   - JPX 業種別時価総額 (月次PDF)・空売り業種別集計 (日次PDF+当月の月次集計)
#     を取得し、一次データとして Notion「一次データ｜moneyflow」へ記録
#   - 既存 D1 (swing_daily_ohlcv×core_stocks.sector) の週次売買代金等を
#     デプロイ済み Worker の内部読取エンドポイント経由で取得
#   - 上記を Notion「資金フロー｜観測ログ」へ upsert、実行結果を
#     「資金フロー｜取込ログ」へ記録
#
#   - Phase 2〜5 の取得元 (scripts/moneyflow/sources.ts に登録した 17 取得元の spec) を
#     共通フロー (scripts/moneyflow/lib/run-spec.ts) で実行。月次・四半期等の取得元は
#     公表済みの最新期間が取込済みなら取得元へ行かずにスキップする (大半の日は数分で終わる)
#
# 必要な GitHub Secrets (既存名を流用。新規は任意の CoinGecko キーのみ):
#   NOTION_TOKEN            … 既存 (vwap-ingest.yml 等と共通)
#   NOTION_STOCK_INFO_PAGE_ID … 既存。「株式情報」ページ。直下の「資金フロー｜指標定義/観測ログ/取込ログ」を使う
#   NOTION_ARCHIVE_PAGE_ID  … 既存。「一次データ保管」ページ。配下の「一次データ｜moneyflow」に原ファイルを保管
#   WORKER_BASE_URL / CRON_SECRET … 既存 (yuho-quant 等の内部エンドポイント認証と共通)
#   YAHOO_PROXY_BASE        … 既存 (stock-sync.yml と共通)。世界の主要指数 (global-indices) が
#                             共有 Yahoo クライアント経由で使う
#   COINGECKO_DEMO_API_KEY  … 新規・任意。未設定でも動くが匿名アクセスは 429 が出やすい
#   R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_BUCKET …
#     日次信用残の保存済snapshot読取 (新しいJPX PDF取得はしない)
#   CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN / D1_DATABASE_ID …
#     同snapshotの銘柄→業種mapping読取
#
# 初回 (Notion が空の状態) は全取得元の最新期間を一度に書くため時間がかかる。
# タイムアウトしても次回実行が「保管済み・観測ログ途中」から再開する (同値行は書き込まない)。
#
# 日次信用残は jpx-margin-sector がR2の実latest基準日を使う。
# sector-turnoverのtrade_dateで信用残の基準日を上書きしない。
name: moneyflow

on:
  # 独立 cron は廃止 (#160)。stock-sync の連鎖 (workflow_call) と手動のみ。
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Notion に書かず JSON を出力するだけにする"
        type: boolean
        default: false
      only:
        description: "実行する取得元 (カンマ区切り。空なら全部)"
        type: string
        default: ""
      trade_date:
        description: "sector-turnover の as-of 日 (YYYY-MM-DD。空なら当日 UTC)"
        type: string
        default: ""
  workflow_call:
    inputs:
      trade_date:
        description: "producer (stock-sync) の実 tradingDate (YYYY-MM-DD。必須)"
        type: string
        required: true
      dry_run:
        description: "Notion に書かず JSON を出力するだけにする"
        type: boolean
        default: false
      only:
        description: "実行する取得元 (カンマ区切り。空なら全部)"
        type: string
        default: ""
    secrets:
      NOTION_TOKEN:
        required: true
      NOTION_ARCHIVE_PAGE_ID:
        required: true
      NOTION_STOCK_INFO_PAGE_ID:
        required: true
      WORKER_BASE_URL:
        required: true
      CRON_SECRET:
        required: true
      YAHOO_PROXY_BASE:
        required: true
      COINGECKO_DEMO_API_KEY:
        required: false
      R2_ACCOUNT_ID:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      R2_BUCKET:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      D1_DATABASE_ID:
        required: false

concurrency:
  group: moneyflow-ingest
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # 失敗時に Issue を立てるため

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_ARCHIVE_PAGE_ID: ${{ secrets.NOTION_ARCHIVE_PAGE_ID }}
      NOTION_STOCK_INFO_PAGE_ID: ${{ secrets.NOTION_STOCK_INFO_PAGE_ID }}
      WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      YAHOO_PROXY_BASE: ${{ secrets.YAHOO_PROXY_BASE }}
      COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
      # jpx-margin-sectorのみが使う既存credentials。他の取得元の必須にはしない。
      # 選択時の欠落は既存の型付きアクセサが停止する。
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # packageManager (pnpm@9.15.9) を読む

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: moneyflow ingest
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.only }}" ]; then
            ARGS="$ARGS --only=${{ inputs.only }}"
          fi
          if [ -n "${{ inputs.trade_date }}" ]; then
            ARGS="$ARGS --as-of=${{ inputs.trade_date }}"
          fi
          pnpm ingest:moneyflow -- $ARGS

      - name: 失敗したら Issue を立てる
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: "[ジョブ失敗] ${{ github.workflow }}"
          summary: "${{ github.workflow }} が失敗しました。"
