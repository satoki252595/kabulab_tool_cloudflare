name: Record native job clock
description: Bind CLI closure budget to this run attempt and runner's actual job start
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        clock=$(timeout 30s python3 scripts/ci/job-clock.py --github)
        echo "BATCH_JOB_STARTED_AT=$clock" >> "$GITHUB_ENV"
