name: Record native job clock
description: Bind CLI closure budget to this run attempt and runner's actual job start
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        clock=$(timeout 30s gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" | python3 scripts/ci/job-clock.py)
        echo "BATCH_JOB_STARTED_AT=$clock" >> "$GITHUB_ENV"
