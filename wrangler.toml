name = "kabulab-cf"
main = "worker/entry.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# 配信 + プロキシ。全サービス D1 移行済み(ADR-0001)。Worker は **無料プラン**で運用する:
#   - 配信: ポータル + 各サービス(D1 読取は c.env.DB バインディング)
#   - 取込プロキシ: Node(GitHub Actions)からの Yahoo 取得を Cloudflare エッジ経由に
#     する認証プロキシ(/vwap-analysis/api/ingest-fetch / /api/ingest/yahoo)。自宅/CI の
#     IP が Yahoo に 429 されるのを回避する。
# 日次/月次の指標・スコア計算と VWAP 取込は **GitHub Actions(Node)** で実行する
#   (createD1HttpDb で D1 へ直接書込・Yahoo は上記プロキシ経由)。Workers Paid を
#   使わないため Workers Cron / [limits] は使わない (subrequest 50/invocation の無料枠では
#   Worker 上で全銘柄 sync を捌けないため)。
# EDINET/TDnet は各サービスの認証ルート /admin/catchup を Node トリガが叩く。
# 母集団(core_stocks)の JPX 同期は `pnpm sync:universe`(Node)。
# 静的アセット（public/ = kabulab PWA資産 + public/vwap-analysis/ フロント）。
[assets]
directory = "public"
binding = "ASSETS"

# VWAP 時系列（intra/daily/margin）。Worker は binding 経由で読取（S3クレデンシャル不要）。
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "vwap-data"

# 正規化リレーショナルの正本（ADR-0001）。Neon からの移行先。binding=DB で
# c.env.DB から参照する。時系列は R2、一次データ(raw)は Notion に置く方針。
# 単一 D1 にサービス別接頭辞テーブル（core_* / yuho_* / ...）を集約する。
[[d1_databases]]
binding = "DB"
database_name = "kabulab-cf"
database_id = "639c0315-0d41-4345-95ab-aec5906224ed"

# CRON_SECRET は取込プロキシ/取込ルートの認証 secret（`wrangler secret put CRON_SECRET`）。
# EDINET_API_KEY / NOTION_TOKEN も Worker 取込ルートで参照する secret（ローカルは .env）。
